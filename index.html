<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>OLA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #fff; }
      body { min-height: 100vh; min-height: 100dvh; }
      .header {
        height: 140px;
        padding-top: 32px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .logo {
        position: relative;
        width: 114px;
        height: 74px;
        overflow: hidden;
        flex: 0 0 auto;
      }
      .logo img {
        display: block;
        position: absolute;
        left: -27px;
        top: -51px;
        width: 174px;
        height: 174px;
        max-width: none;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img src="assets/ola-logo.png" alt="OLA" width="1254" height="1254">
      </div>
    </header>
    <main aria-label="OLA"></main>
  </body>
</html>
